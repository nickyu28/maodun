# 冒烟测试 + 部署到 GitHub Pages（B3）
#
# 推到 main：先跑冒烟测试，通过了才部署（Pages 的 Source 是「GitHub Actions」）。
#
# 手动触发（Actions 页 → Smoke test and deploy → Run workflow）：
#   force 勾上 = 不管冒烟测试结果，强制发布一次（测试本身出问题时用）。
#
# 冒烟测试里"几何体泄漏"那一项是已知问题（等 D1），只报告 XFAIL，不会让这里失败。
# D1 做完后把 tests/smoke.js 里的 EXPECT_GEOMETRY_LEAK 改成 false，它就必须通过。

name: Smoke test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: '不管冒烟测试结果，强制发布'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/smoke.js

  deploy:
    needs: smoke
    if: ${{ github.event_name != 'pull_request' && (needs.smoke.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.force)) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
